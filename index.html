<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- nav -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><i class="fa-solid fa-utensils"></i> What's For Dinner</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- nav end -->
    <!-- home -->
    <div class="home">
      <div class="container mt-5">
        <div class="row rounded-4 overflow-hidden bg-white">
          <!-- image -->
          <div class="col-md-5 p-0">
            <div class="img h-100 object-fit-cover position-relative">
              <span
                class="reviwes position-absolute top-0 start-0 m-3 bg-white rounded-pill px-3 py-1"
              >
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59)"></i
                >
                <span id="rate">4.9(512 reviews)</span>
              </span>

              <div
                style="left: 20px; right: 20px; bottom: 20px"
                class="info position-absolute rounded-3 bg-white text-center"
              >
                <div class="row">
                  <!-- prep time -->
                  <div class="col-4">
                    <i style="color: orange" class="fa-solid fa-stopwatch"></i>
                    <p>Prep Time</p>
                    <p id="prepTime">90 min</p>
                  </div>
                  <!-- cook time -->
                  <div class="col-4">
                    <i style="color: red" class="fa-solid fa-fire-burner"></i>
                    <p>Cook Time</p>
                    <p id="cookTime">12 min</p>
                  </div>
                  <!-- serves -->
                  <div class="col-4">
                    <i style="color: blue" class="fa-solid fa-users"></i>
                    <p>Serves</p>
                    <p id="serves">4 people</p>
                  </div>
                </div>
              </div>
              <img id="mealImg"
                class="w-100 h-100"
                src=""
                alt="hero"
              />
            </div>
          </div>
          <!-- content -->
          <div class="col-md-7">
            <div class="inner d-flex flex-column gap-3 py-3">
              <!-- tags -->
              <div class="tags">
                <span id="difficulty" class="badge text-bg-success"></span>
                <span id="cuisine" class="badge text-bg-primary">Italian</span>
              </div>
              <!-- title -->
              <h1 id="mealName">Margherita Pizza</h1>
              <!-- description -->
              <p id="mealDescription">Classic Italian pizza with fresh mozzarella and basil</p>

              <!-- warning -->
              <div id="warning"
                class=" warning d-flex align-items-center gap-3 alert alert-danger"
              >
                <div class="icon">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="txt">
                  <h5>Extended Preparation Time</h5>
                  <p>
                    This recipe requires more than 45 minutes to prepare. Plan
                    accordingly!
                  </p>
                </div>
              </div>

              <!-- navs and taps -->
              <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link active"
                    id="home-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#home-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="home-tab-pane"
                    aria-selected="true"
                  >
                    Ingredients
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    id="profile-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#profile-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="profile-tab-pane"
                    aria-selected="false"
                  >
                    Instructions
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    id="contact-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#contact-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="contact-tab-pane"
                    aria-selected="false"
                  >
                    Nutrition
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    id="disabled-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#disabled-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="disabled-tab-pane"
                    aria-selected="false"
                  >
                    chef's Tips
                  </button>
                </li>
              </ul>

              
              <div class="tab-content" id="myTabContent">
                <!--Ingredients  -->
                <div
                  class="tab-pane fade show active"
                  id="home-tab-pane"
                  role="tabpanel"
                  aria-labelledby="home-tab"
                  tabindex="0"
                >
                  <!-- content -->
                  <div  style="background: wheat" class="rounded-3">
                    <ul class="list-unstyled d-flex flex-column gap-2 p-3" id="ingredients">
                      <!-- <li class="d-flex">
                        <span
                          class="d-flex align-items-center justify-content-center me-2 rounded-circle"
                          style="
                            width: 30px;
                            height: 30px;
                            background: orange;
                            color: white;
                          "
                        >
                          1</span
                        >300g pizza dough
                      </li> -->
                      
                    </ul>
                  </div>
                </div>
                <!-- Instructions -->
                <div
                  class="tab-pane fade"
                  id="profile-tab-pane"
                  role="tabpanel"
                  aria-labelledby="profile-tab"
                  tabindex="0"
                >
                  <div class="rounded-3">
                    <ul id="instructions" class="list-unstyled d-flex flex-column gap-2 p-3">
                      <!-- <li class="d-flex align-items-center">
                        <span
                          class="d-flex align-items-center justify-content-center me-2 rounded-4"
                          style="
                            width: 50px;
                            height: 50px;
                            background: orange;
                            color: white;
                          "
                        >
                          1</span
                        >300g pizza dough
                      </li> -->
                      
                    </ul>
                  </div>
                </div>
                <!-- Nutrition -->
                <div
                  class="tab-pane fade"
                  id="contact-tab-pane"
                  role="tabpanel"
                  aria-labelledby="contact-tab"
                  tabindex="0"
                >
                   <div class="rounded-3">
                    <div id="nutrition" class="row g-3">
                        <!-- <div class="col-6">
                            <div class="inner bg-secondary-subtle p-3 rounded-3 d-flex justify-content-between align-items-center">
                                <div class="icon"><span style="color: orangered;"><i class="fa-solid fa-fire"></i></span></div>
                                <div class="value">Calories 250 kcal</div>
                            </div>
                        
                        </div> -->
                        
                    </div>
                  </div>
                </div>
                <!-- chef's  Tips -->
                <div
                  class="tab-pane fade"
                  id="disabled-tab-pane"
                  role="tabpanel"
                  aria-labelledby="disabled-tab"
                  tabindex="0"
                >
                  <div  class="rounded-3">
                    <ul id="tips" class="list-unstyled d-flex flex-column gap-2 p-3">
                      <!-- <li style="background-color: antiquewhite; border-left: 2px solid orange;" class="align-items-center p-2 d-flex rounded-3">
                        <span
                          class="d-flex align-items-center justify-content-center me-2 rounded-circle"
                          style="
                            width: 20px;
                            height: 20px;
                            background: orange;
                            color: white;
                          "
                        >
                          <i class="fa-solid fa-check"></i></span
                        >Use a pizza stone for crispier crust
                      </li> -->
                      
                    </ul>
                  </div>
                </div>
              </div>

              <button id="randomRecipe" class="btn btn-success "><i class="fa-solid fa-rotate"></i> try another recipe</button>
            </div>

          </div>
        </div>
      </div>
    </div>
    <!-- home end -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
